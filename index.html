<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Pro Video Editor Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding: 8px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    .editor-container { width: 100%; max-width: 480px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }

    /* Top Video Preview Monitor */
    .monitor-screen { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #1f2937; }
    canvas { width: 100%; height: 100%; object-fit: contain; }
    .timecode { position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,0.7); color: #38bdf8; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-family: monospace; }

    /* Timeline / Track Area (Like Video Editors) */
    .timeline-strip { background: #1f2937; padding: 8px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid #374151; }
    .track-block { min-width: 55px; height: 35px; background: #374151; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #9ca3af; border: 1px solid #4b5563; flex-shrink: 0; }
    .track-block.active { border-color: #38bdf8; color: #38bdf8; background: #0f172a; font-weight: bold; }

    /* Control Toolbar */
    .toolbar { display: flex; background: #111827; padding: 8px; gap: 6px; border-bottom: 1px solid #1f2937; justify-content: space-around; }
    .tool-btn { background: #1f2937; color: #cbd5e1; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .tool-btn:hover { background: #374151; color: #fff; }

    /* Inspector / Settings Panel */
    .inspector { padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #0d1322; }
    .panel-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    
    textarea, select, input { width: 100%; background: #111827; border: 1px solid #374151; color: white; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }
    textarea { height: 50px; resize: none; }

    /* Export / Render Button */
    .export-bar { padding: 10px; background: #111827; display: flex; flex-direction: column; gap: 6px; }
    .render-btn { width: 100%; background: linear-gradient(135deg, #2563eb, #16a34a); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; letter-spacing: 0.5px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #status { font-size: 11px; color: #38bdf8; text-align: center; font-weight: 500; min-height: 16px; }
    .progress-bar { width: 100%; height: 4px; background: #374151; border-radius: 2px; overflow: hidden; display: none; }
    #pFill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.3s; }
    .dl-btn { background: #16a34a; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; text-align: center; display: block; font-size: 12px; }
  </style>
</head>
<body>

  <div class="editor-container">
    
    <!-- 1. Video Monitor Preview -->
    <div class="monitor-screen">
      <canvas id="movieCanvas" width="1280" height="720"></canvas>
      <div class="timecode" id="timecodeDisp">00:00 / 01:00</div>
    </div>

    <!-- 2. Multitrack Timeline -->
    <div class="timeline-strip" id="timelineStrip">
      <div class="track-block active">S1</div>
      <div class="track-block">S2</div>
      <div class="track-block">S3</div>
      <div class="track-block">S4</div>
      <div class="track-block">S5</div>
      <div class="track-block">S6</div>
    </div>

    <!-- 3. Editing Toolbar -->
    <div class="toolbar">
      <button class="tool-btn" onclick="aiAssistantChat()">🤖 AI Script</button>
      <button class="tool-btn" onclick="previewSingleScene()">▶️ Preview</button>
      <button class="tool-btn" onclick="clearTimeline()">🗑️ Reset</button>
    </div>

    <!-- 4. Property Inspector (Settings) -->
    <div class="inspector">
      <div class="panel-group">
        <label>📝 Story / Scene Script</label>
        <textarea id="videoPromptInput" placeholder="Apni kahani yahan likhein (e.g. Cyberpunk anime warrior in neon city)...">Dark anime hero unlocking legendary sword power</textarea>
      </div>

      <div class="panel-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
        <div>
          <label>🎨 Animation Style</label>
          <select id="visualStyle">
            <option value="anime" selected>✨ Shonen Anime</option>
            <option value="cyberpunk">⚡ Cyberpunk Neon</option>
            <option value="pixar3d">🧸 3D Pixar</option>
            <option value="noir">🕶️ Dark Noir</option>
          </select>
        </div>
        <div>
          <label>⏱️ Duration</label>
          <select id="videoDuration">
            <option value="1">1 Minute (6 Scenes)</option>
            <option value="2" selected>2 Minutes (12 Scenes)</option>
            <option value="3">3 Minutes (18 Scenes)</option>
          </select>
        </div>
      </div>

      <div class="panel-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
        <div>
          <label>🎙️ Voiceover</label>
          <select id="voiceMode">
            <option value="male" selected>Male Storyteller</option>
            <option value="female">Female Narrative</option>
            <option value="mute">Mute (No Voice)</option>
          </select>
        </div>
        <div>
          <label>🎥 Camera Motion</label>
          <select id="cameraMotion">
            <option value="zoom_in">Zoom In</option>
            <option value="zoom_out">Zoom Out</option>
            <option value="pan_right">Pan Travel</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 5. Export / Render Section -->
    <div class="export-bar">
      <button class="render-btn" id="startBtn" onclick="renderProVideo()">🎬 Export & Render Full Video</button>
      <div class="progress-bar" id="pContainer"><div id="pFill"></div></div>
      <div id="status">Editor Ready. Click Export to Render.</div>
      <div id="downloadArea"></div>
    </div>

  </div>

  <script>
    const GEMINI_API_KEY = "AIzaSyAQEPDRqn9-b-W30b1-iwhqec6BtEG2dnE";
    const canvas = document.getElementById('movieCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const pContainer = document.getElementById('pContainer');
    const pFill = document.getElementById('pFill');
    const downloadArea = document.getElementById('downloadArea');
    const timecodeDisp = document.getElementById('timecodeDisp');

    let audioContext = null;

    // Initial Monitor Screen Draw
    ctx.fillStyle = '#0b0f19';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('JARVIS Pro Video Editor', canvas.width / 2, canvas.height / 2);

    function applyVoiceProfile(utt, genderType) {
      utt.lang = 'hi-IN';
      if (genderType === 'female') { utt.pitch = 1.4; utt.rate = 0.95; }
      else { utt.pitch = 0.75; utt.rate = 0.92; }
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      const lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (context.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);
      const totalH = lines.length * lineHeight;
      const startY = y - (totalH / 2) + (lineHeight / 2);
      for (let k = 0; k < lines.length; k++) {
        context.fillText(lines[k], x, startY + (k * lineHeight));
      }
    }

    async function aiAssistantChat() {
      const prompt = document.getElementById('videoPromptInput').value;
      status.innerText = "AI Script optimizing...";
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: `Aap video editor hain. Is concept par 1 line catchy dialogue dein: "${prompt}"` }] }] })
        });
        const data = await res.json();
        const text = data.candidates[0].content.parts[0].text;
        alert("AI Director Suggestion:\n\n" + text);
        status.innerText = "AI Script optimized!";
      } catch(e) {
        status.innerText = "Ready to Render.";
      }
    }

    async function generateScriptScenes(promptText, totalScenes, style) {
      const instruction = `Return ONLY a valid JSON array of ${totalScenes} cinematic scenes for: "${promptText}". Style: "${style}". Format: [{"prompt": "detailed English prompt", "sub": "Hindi dialogue"}]`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: instruction }] }] })
        });
        const data = await res.json();
        return JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());
      } catch (e) {
        const fallbacks = [];
        for (let i = 1; i <= totalScenes; i++) {
          fallbacks.push({
            prompt: `4k keyframe ${i} of ${totalScenes}, ${style} style, ${promptText}`,
            sub: `${promptText} - Scene ${i}`
          });
        }
        return fallbacks;
      }
    }

    async function renderProVideo() {
      const story = document.getElementById('videoPromptInput').value.trim();
      const minutes = parseInt(document.getElementById('videoDuration').value);
      const totalScenes = minutes * 6;
      const style = document.getElementById('visualStyle').value;
      const motion = document.getElementById('cameraMotion').value;
      const voiceMode = document.getElementById('voiceMode').value;

      startBtn.disabled = true;
      downloadArea.innerHTML = '';
      pContainer.style.display = 'block';
      pFill.style.width = '10%';
      status.innerText = "Generating Timeline Scenes...";

      const scenes = await generateScriptScenes(story, totalScenes, style);
      const loadedImages = [];

      for (let s = 0; s < scenes.length; s++) {
        status.innerText = `Loading Track Asset (${s + 1}/${scenes.length})...`;
        pFill.style.width = `${10 + (s / scenes.length) * 40}%`;
        const seed = Math.floor(Math.random() * 99999);
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scenes[s].prompt + ', ' + style + ' style')}?seed=${seed}&width=1280&height=720&nologo=true`;
        
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise(res => { img.onload = res; img.onerror = res; img.src = imgUrl; });
        loadedImages.push(img);
      }

      status.innerText = "Encoding Pro Video Stream...";
      pFill.style.width = '55%';

      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') await audioContext.resume();

      const dest = audioContext.createMediaStreamDestination();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.frequency.setValueAtTime(75, audioContext.currentTime);
      gain.gain.setValueAtTime(0.03, audioContext.currentTime);
      osc.connect(gain);
      gain.connect(dest);
      osc.start();

      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([...videoStream.getVideoTracks(), dest.stream.getAudioTracks()[0]]);

      let mime = 'video/webm;codecs=vp8,opus';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      const recorder = new MediaRecorder(combinedStream, { mimeType: mime });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      const finishPromise = new Promise(res => recorder.onstop = () => res(new Blob(chunks, { type: 'video/webm' })));

      recorder.start();

      for (let i = 0; i < loadedImages.length; i++) {
        pFill.style.width = `${55 + ((i + 1) / loadedImages.length) * 40}%`;
        status.innerText = `Rendering Track Scene ${i + 1}/${loadedImages.length}...`;
        timecodeDisp.innerText = `00:${(i*5).toString().padStart(2,'0')} / 0${minutes}:00`;
        await renderSingleTrackScene(loadedImages[i], scenes[i].sub, motion, style, voiceMode, 150);
      }

      recorder.stop();
      const blob = await finishPromise;

      const dl = document.createElement('a');
      dl.className = 'dl-btn';
      dl.href = URL.createObjectURL(blob);
      dl.download = `JARVIS_Pro_Edit_${minutes}Min.webm`;
      dl.innerText = `📥 Download Rendered Video (${minutes} Min)`;
      downloadArea.appendChild(dl);

      pFill.style.width = '100%';
      status.innerText = "✅ Video Export Successful!";
      startBtn.disabled = false;
    }

    function renderSingleTrackScene(img, subtitle, motion, style, voiceMode, totalFrames) {
      return new Promise(resolve => {
        let frame = 0;
        if (voiceMode !== 'mute' && 'speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utt = new SpeechSynthesisUtterance(subtitle);
          applyVoiceProfile(utt, voiceMode);
          window.speechSynthesis.speak(utt);
        }

        const interval = setInterval(() => {
          frame++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (style === 'noir') ctx.filter = 'grayscale(1) contrast(2.0)';
          else if (style === 'cyberpunk') ctx.filter = 'hue-rotate(35deg) saturate(1.8)';
          else ctx.filter = 'none';

          let scale = 1.0;
          let offX = 0;
          if (motion === 'zoom_in') scale = 1 + (frame / totalFrames) * 0.08;
          else if (motion === 'zoom_out') scale = 1.08 - (frame / totalFrames) * 0.08;

          const w = canvas.width * scale;
          const h = canvas.height * scale;
          const x = (canvas.width - w) / 2 + offX;
          const y = (canvas.height - h) / 2;

          ctx.drawImage(img, x, y, w, h);
          ctx.filter = 'none';

          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(30, canvas.height - 90, canvas.width - 60, 65);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          wrapText(ctx, subtitle, canvas.width / 2, canvas.height - 57, canvas.width - 90, 24);

          if (frame >= totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 1000 / 30);
      });
    }
  </script>
</body>
</html>
