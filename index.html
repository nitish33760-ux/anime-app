<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Pro Studio with History Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #030712; color: #f8fafc; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .studio-box { width: 100%; max-width: 480px; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
    
    h1 { font-size: 18px; color: #38bdf8; text-align: center; font-weight: 800; }
    .badge-bar { display: flex; justify-content: center; gap: 8px; font-size: 10px; font-weight: 600; }
    .gemini-badge { color: #38bdf8; background: #082f49; padding: 3px 8px; border-radius: 6px; }
    .chatgpt-badge { color: #4ade80; background: #052e16; padding: 3px 8px; border-radius: 6px; }

    /* Video Monitor Preview */
    .monitor-screen { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #334155; overflow: hidden; }
    canvas { width: 100%; height: 100%; object-fit: contain; }

    /* Panels */
    .panel { background: #090d16; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    
    .chat-container { width: 100%; height: 75px; background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .msg { padding: 4px 8px; border-radius: 4px; font-size: 11px; line-height: 1.3; max-width: 90%; }
    .msg-user { background: #2563eb; color: white; align-self: flex-end; }
    .msg-gemini { background: #082f49; border-left: 2px solid #38bdf8; color: #e0f2fe; align-self: flex-start; }
    .msg b { display: block; font-size: 8px; opacity: 0.8; text-transform: uppercase; }

    .input-row { display: flex; gap: 6px; }
    input[type="text"], textarea, select { width: 100%; background: #020617; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; }
    textarea { height: 45px; resize: none; }
    .send-btn { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }

    /* Style Grid */
    .style-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-height: 150px; overflow-y: auto; padding: 2px; }
    .style-card { background: #020617; border: 2px solid #1e293b; border-radius: 8px; padding: 6px; display: flex; gap: 6px; align-items: center; cursor: pointer; }
    .style-card.selected { border-color: #38bdf8; background: #082f49; }
    .style-card img { width: 45px; height: 35px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
    .style-info span { font-size: 10px; font-weight: 700; color: #f8fafc; display: block; }

    /* History Vault Drawer */
    .history-box { max-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item { background: #020617; border: 1px solid #1e293b; padding: 6px; border-radius: 6px; font-size: 10px; color: #38bdf8; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .history-item:hover { background: #082f49; }

    /* Export Button */
    .render-btn { width: 100%; background: linear-gradient(135deg, #16a34a, #2563eb); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #status { font-size: 12px; color: #38bdf8; text-align: center; font-weight: 600; min-height: 18px; }
    .progress-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; display: none; }
    #pFill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.3s; }
    .dl-btn { background: #16a34a; color: white; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; text-align: center; display: block; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="studio-box">
    <h1>🎬 JARVIS History Studio</h1>
    <div class="badge-bar">
      <span class="gemini-badge">🔵 Gemini Director</span>
      <span class="chatgpt-badge">🟢 ChatGPT Scripter</span>
    </div>

    <div class="monitor-screen">
      <canvas id="movieCanvas" width="1280" height="720"></canvas>
    </div>

    <div class="panel">
      <label>💬 Dual-AI Boardroom</label>
      <div class="chat-container" id="chatLogs">
        <div class="msg msg-gemini"><b>Gemini & ChatGPT</b>Boss! Aapki saari chat aur history ab niche 'History Vault' mein secure rahegi.</div>
      </div>
      <div class="input-row">
        <input type="text" id="userInput" placeholder="AI se baat karein..." onkeypress="if(event.key==='Enter') sendToDualAI()">
        <button class="send-btn" onclick="sendToDualAI()">Send</button>
      </div>
    </div>

    <div class="panel">
      <label>🎨 Select Visual Style</label>
      <div class="style-grid" id="styleGrid">
        <div class="style-card selected" onclick="selectStyle(this, 'Korean Webtoon Manhwa masterpiece, detailed eyes')">
          <img src="https://image.pollinations.ai/prompt/Korean%20Webtoon%20Manhwa%20boy?width=80&height=60&nologo=true" alt="Manhwa">
          <div class="style-info"><span>Manhwa Style</span></div>
        </div>
        <div class="style-card" onclick="selectStyle(this, 'Romantic novel illustration, emotional couple')">
          <img src="https://image.pollinations.ai/prompt/Romantic%20anime%20couple?width=80&height=60&nologo=true" alt="Romance">
          <div class="style-info"><span>Romance</span></div>
        </div>
        <div class="style-card" onclick="selectStyle(this, 'TV Anime look, action scene, vibrant colors')">
          <img src="https://image.pollinations.ai/prompt/TV%20Anime%20action%20scene?width=80&height=60&nologo=true" alt="Anime">
          <div class="style-info"><span>Anime Style</span></div>
        </div>
        <div class="style-card" onclick="selectStyle(this, 'Cinematic movie scene, 8k resolution')">
          <img src="https://image.pollinations.ai/prompt/Cinematic%20movie%20sunset?width=80&height=60&nologo=true" alt="Cinematic">
          <div class="style-info"><span>Cinematic</span></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <label>📝 Master Story / Script <span style="color:#38bdf8; cursor:pointer;" onclick="clearHistory()">Clear Vault 🗑️</span></label>
      <textarea id="videoPromptInput" placeholder="Apni kahani yahan likhein..."></textarea>
    </div>

    <div class="panel">
      <label>📂 History Vault (Purana Kaam Yahan Milega)</label>
      <div class="history-box" id="historyBox">
        <div style="font-size:10px; color:#64748b; text-align:center; padding:10px;">Abhi koi history nahi hai. Video export karein!</div>
      </div>
    </div>

    <div class="panel" style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
      <div>
        <label>⏱️ Part Duration</label>
        <select id="videoDuration">
          <option value="1">1 Min Part</option>
          <option value="3" selected>3 Min Part</option>
        </select>
      </div>
      <div>
        <label>🎬 Action</label>
        <button class="render-btn" id="startBtn" onclick="renderVideoPart()" style="padding: 8px; font-size: 11px; margin-top: 2px;">🚀 Export Video</button>
      </div>
    </div>
    
    <div class="progress-bar" id="pContainer"><div id="pFill"></div></div>
    <div id="status">Studio Ready. History vault active.</div>
    <div id="downloadArea"></div>

  </div>

  <script>
    const GEMINI_API_KEY = "AIzaSyAQEPDRqn9-b-W30b1-iwhqec6BtEG2dnE";
    const canvas = document.getElementById('movieCanvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const pContainer = document.getElementById('pContainer');
    const pFill = document.getElementById('pFill');
    const downloadArea = document.getElementById('downloadArea');
    const chatLogs = document.getElementById('chatLogs');
    const userInput = document.getElementById('userInput');
    const videoPromptInput = document.getElementById('videoPromptInput');
    const historyBox = document.getElementById('historyBox');

    let selectedStylePrompt = "Korean Webtoon Manhwa masterpiece, detailed eyes";
    let audioContext = null;

    ctx.fillStyle = '#030712';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('JARVIS History Studio Online', canvas.width / 2, canvas.height / 2);

    // Load History on Startup
    window.onload = function() {
      loadHistoryVault();
    };

    function selectStyle(element, promptText) {
      document.querySelectorAll('.style-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      selectedStylePrompt = promptText;
    }

    function saveToHistory(storyText) {
      let history = JSON.parse(localStorage.getItem('jarvis_history') || '[]');
      history.unshift({ text: storyText, date: new Date().toLocaleTimeString() });
      if (history.length > 10) history.pop(); // Keep last 10
      localStorage.setItem('jarvis_history', JSON.stringify(history));
      loadHistoryVault();
    }

    function loadHistoryVault() {
      let history = JSON.parse(localStorage.getItem('jarvis_history') || '[]');
      if (history.length === 0) {
        historyBox.innerHTML = '<div style="font-size:10px; color:#64748b; text-align:center; padding:10px;">Abhi koi history nahi hai. Video export karein!</div>';
        return;
      }
      historyBox.innerHTML = '';
      history.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<span>⏳ ${item.date}: ${item.text.substring(0, 30)}...</span> <b>Load</b>`;
        div.onclick = () => {
          videoPromptInput.value = item.text;
          status.innerText = "Loaded from History Vault!";
        };
        historyBox.appendChild(div);
      });
    }

    function clearHistory() {
      localStorage.removeItem('jarvis_history');
      loadHistoryVault();
      status.innerText = "History Vault Cleared!";
    }

    function addMessage(sender, text, cls) {
      const msg = document.createElement('div');
      msg.className = `msg ${cls}`;
      msg.innerHTML = `<b>${sender}</b>${text}`;
      chatLogs.appendChild(msg);
      chatLogs.scrollTop = chatLogs.scrollHeight;
    }

    async function sendToDualAI() {
      const query = userInput.value.trim();
      if (!query) return;
      videoPromptInput.value = query;
      userInput.value = '';
      addMessage("Aap", query, "msg-user");
      saveToHistory(query);

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: `Aap animation director hain. User: "${query}". 1 line dialogue dein.` }] }] })
        });
        const data = await res.json();
        addMessage("Gemini & ChatGPT", data.candidates[0].content.parts[0].text, "msg-gemini");
      } catch (e) {
        addMessage("Gemini & ChatGPT", "Saved to history vault!", "msg-gemini");
      }
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      const lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (context.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);
      const totalH = lines.length * lineHeight;
      const startY = y - (totalH / 2) + (lineHeight / 2);
      for (let k = 0; k < lines.length; k++) {
        context.fillText(lines[k], x, startY + (k * lineHeight));
      }
    }

    async function generateScriptScenes(promptText, totalScenes) {
      const instruction = `Return ONLY a valid JSON array of ${totalScenes} cinematic scenes for story: "${promptText}". Format: [{"prompt": "detailed English prompt", "sub": "Hindi dialogue line"}]`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: instruction }] }] })
        });
        const data = await res.json();
        return JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());
      } catch (e) {
        const fallbacks = [];
        for (let i = 1; i <= totalScenes; i++) {
          fallbacks.push({
            prompt: `masterpiece scene ${i} of ${totalScenes}, ${promptText}`,
            sub: `${promptText} - Scene ${i}`
          });
        }
        return fallbacks;
      }
    }

    async function renderVideoPart() {
      const story = videoPromptInput.value.trim();
      if (!story) return;
      saveToHistory(story);

      const minutes = parseInt(document.getElementById('videoDuration').value);
      const totalScenes = minutes * 5;

      startBtn.disabled = true;
      downloadArea.innerHTML = '';
      pContainer.style.display = 'block';
      pFill.style.width = '10%';
      status.innerText = "Generating Script & Visuals...";

      const scenes = await generateScriptScenes(story, totalScenes);
      const loadedImages = [];

      for (let s = 0; s < scenes.length; s++) {
        status.innerText = `Loading Asset (${s + 1}/${scenes.length})...`;
        pFill.style.width = `${10 + (s / scenes.length) * 40}%`;
        const seed = Math.floor(Math.random() * 99999);
        const finalPrompt = `${scenes[s].prompt}, ${selectedStylePrompt}`;
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?seed=${seed}&width=1280&height=720&nologo=true`;
        
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise(res => { img.onload = res; img.onerror = res; img.src = imgUrl; });
        loadedImages.push(img);
      }

      status.innerText = "Encoding Video Stream...";
      pFill.style.width = '55%';

      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') await audioContext.resume();

      const dest = audioContext.createMediaStreamDestination();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.frequency.setValueAtTime(80, audioContext.currentTime);
      gain.gain.setValueAtTime(0.03, audioContext.currentTime);
      osc.connect(gain);
      gain.connect(dest);
      osc.start();

      const videoStream = canvas.captureStream(30);
      const combinedStream = new MediaStream([...videoStream.getVideoTracks(), dest.stream.getAudioTracks()[0]]);

      let mime = 'video/webm;codecs=vp8,opus';
      if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';

      const recorder = new MediaRecorder(combinedStream, { mimeType: mime });
      const chunks = [];
      recorder.ondataavailable = e => chunks.push(e.data);
      const finishPromise = new Promise(res => recorder.onstop = () => res(new Blob(chunks, { type: 'video/webm' })));

      recorder.start();

      for (let i = 0; i < loadedImages.length; i++) {
        pFill.style.width = `${55 + ((i + 1) / loadedImages.length) * 40}%`;
        status.innerText = `Rendering Scene ${i + 1}/${loadedImages.length}...`;
        await renderSceneFrame(loadedImages[i], scenes[i].sub, 150);
      }

      recorder.stop();
      const blob = await finishPromise;

      const dl = document.createElement('a');
      dl.className = 'dl-btn';
      dl.href = URL.createObjectURL(blob);
      dl.download = `JARVIS_History_Part_${Date.now()}.webm`;
      dl.innerText = `📥 Download Video Part (${minutes} Min)`;
      downloadArea.appendChild(dl);

      pFill.style.width = '100%';
      status.innerText = "✅ Video Part Export Successful & Saved to History!";
      startBtn.disabled = false;
    }

    function renderSceneFrame(img, subtitle, totalFrames) {
      return new Promise(resolve => {
        let frame = 0;
        const interval = setInterval(() => {
          frame++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.filter = 'none';

          let scale = 1 + (frame / totalFrames) * 0.07;
          const w = canvas.width * scale;
          const h = canvas.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;

          ctx.drawImage(img, x, y, w, h);

          ctx.fillStyle = 'rgba(0,0,0,0.85)';
          ctx.fillRect(30, canvas.height - 90, canvas.width - 60, 65);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 18px sans-serif';
          ctx.textAlign = 'center';
          wrapText(ctx, subtitle, canvas.width / 2, canvas.height - 57, canvas.width - 90, 24);

          if (frame >= totalFrames) {
            clearInterval(interval);
            resolve();
          }
        }, 1000 / 30);
      });
    }
  </script>
</body>
</html>
